name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Generate Native Android Scaffolding
        run: |
          mkdir -p temp_backup
          cp -r android temp_backup/ || true
          flutter create --platforms=android .
          if [ -d "temp_backup/android/app/src/main" ]; then
            cp -r temp_backup/android/app/src/main/* android/app/src/main/ || true
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Atelier-Chrono-APK
          path: build/app/outputs/flutter-apk/app-release.apk

